# Runs Laravel quality checks and deploys the main branch to the production server over SSH.
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  ci:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3
          coverage: none

      - name: Restore Composer download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-downloads-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-downloads-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check PHP code style
        continue-on-error: true
        run: ./vendor/bin/pint --test

      - name: Check JavaScript formatting
        continue-on-error: true
        run: npm run format:check

      - name: Check TypeScript types
        continue-on-error: true
        run: npm run types

      - name: Test Laravel application
        continue-on-error: true
        run: php artisan test

      - name: Build frontend assets
        run: npm run build

  deploy:
    name: Deploy to production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy application over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git pull --ff-only origin main

            prepare_laravel_storage() {
              mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache

              WEB_USER="hisotechgroup"

              if ! id "$WEB_USER" >/dev/null 2>&1; then
                echo "Configured web user '$WEB_USER' does not exist on the server."
                exit 1
              fi

              WEB_GROUP="$(id -gn "$WEB_USER")"

              if [ "$(id -u)" -ne 0 ]; then
                echo "The deploy user must be root to update Laravel storage ownership."
                exit 1
              fi

              chown -R "$WEB_USER:$WEB_GROUP" storage bootstrap/cache
              chmod -R ug+rwX storage bootstrap/cache
            }

            prepare_laravel_storage
            npm ci
            npm run build
            php artisan migrate --force
            php artisan optimize:clear
            prepare_laravel_storage
            php artisan optimize
